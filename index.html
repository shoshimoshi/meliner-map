<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metliner World Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    #map { width: 100%; }
    /* Hide the simplemaps trial watermark */
    a[href="https://simplemaps.com"],
    a[href*="simplemaps.com"][title*="evaluation"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  </style>
  <!--
    FIX: force same-tab navigation of the TOP window (replaces the Google Sites page).
    Two layers:
      1) Override window.open so any attempt to open a new tab is redirected to window.top.
      2) Capture-phase click listener that catches <a target="_blank"> before the browser
         acts on it, and navigates window.top instead.
  -->
  <script>
    (function() {
      function goTop(url) {
        try { window.top.location.href = url; }
        catch (e) { window.location.href = url; }
      }

      // Layer 1: neutralize window.open for metliner links
      var _origOpen = window.open;
      window.open = function(url, target, features) {
        if (url && url.indexOf('metliner.com') !== -1) {
          goTop(url);
          return null;
        }
        return _origOpen.call(window, url, target, features);
      };

      // Layer 2: intercept clicks on generated links in the capture phase,
      // before simplemaps / the browser opens a new tab.
      document.addEventListener('click', function(e) {
        var a = e.target;
        while (a && a.tagName !== 'A') { a = a.parentNode; }
        if (a && a.href && a.href.indexOf('metliner.com') !== -1) {
          e.preventDefault();
          e.stopPropagation();
          goTop(a.href);
        }
      }, true); // <-- true = capture phase, runs before other handlers

      // Hide the simplemaps trial watermark (unchanged)
      function hideTrial() {
        var links = document.querySelectorAll('a[href*="simplemaps.com"]');
        links.forEach(function(el) {
          el.style.setProperty('display', 'none', 'important');
          if (el.parentNode) el.parentNode.style.setProperty('display', 'none', 'important');
        });
      }
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) { if (m.addedNodes.length) hideTrial(); });
      });
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, { childList: true, subtree: true });
        hideTrial();
      });
      setTimeout(hideTrial, 500);
      setTimeout(hideTrial, 1500);
    })();
  </script>
  <script src="mapdata.js"></script>
  <script src="worldmap.js"></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
