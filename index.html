<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metliner World Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    #map { width: 100%; }
    a[href="https://simplemaps.com"],
    a[href*="simplemaps.com"][title*="evaluation"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  </style>
  <!--
    Cross-origin safe navigation.
    When embedded in Google Sites, this map lives in a cross-origin iframe, so
    window.top.location.href is BLOCKED by the browser (that is why clicks did
    nothing on the live site but worked on the raw github.io page).
    Fix: navigate the top-level browsing context with a named target ("_top"),
    which browsers DO allow across origins. We hijack the generated links'
    target so simplemaps' own navigation lands in the top window / same tab.
  -->
  <script>
    (function() {
      function goTopSameTab(url) {
        // _top = replace the whole top-level page in the SAME tab (allowed cross-origin)
        var w = window.open(url, '_top');
        if (!w) {
          // last-resort fallbacks
          try { window.top.location.href = url; }
          catch (e) { window.location.href = url; }
        }
      }

      // Redirect any window.open for metliner links into the top, same tab
      var _origOpen = window.open;
      window.open = function(url, target, features) {
        if (url && url.indexOf('metliner.com') !== -1) {
          return _origOpen.call(window, url, '_top');
        }
        return _origOpen.call(window, url, target, features);
      };

      // Catch clicks on the generated <a> links and force target="_top"
      // so the parent (Google Sites) page navigates in the same tab.
      document.addEventListener('click', function(e) {
        var a = e.target;
        while (a && a.tagName !== 'A') { a = a.parentNode; }
        if (a && a.href && a.href.indexOf('metliner.com') !== -1) {
          a.setAttribute('target', '_top'); // let the browser do the navigation
        }
      }, true);

      function hideTrial() {
        var links = document.querySelectorAll('a[href*="simplemaps.com"]');
        links.forEach(function(el) {
          el.style.setProperty('display', 'none', 'important');
          if (el.parentNode) el.parentNode.style.setProperty('display', 'none', 'important');
        });
      }
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) { if (m.addedNodes.length) hideTrial(); });
      });
      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, { childList: true, subtree: true });
        hideTrial();
      });
      setTimeout(hideTrial, 500);
      setTimeout(hideTrial, 1500);
    })();
  </script>
  <script src="mapdata.js"></script>
  <script src="worldmap.js"></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
