<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metliner – World Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; }
    #map { width: 100%; }
  </style>

  <!--
    KEY FIX: Override window.open BEFORE simplemaps loads.
    When a city pin is clicked, simplemaps calls window.open(url, '_blank').
    We intercept that call and redirect window.top instead —
    this makes the parent Google Sites page navigate directly, no new tab.
  -->
  <script>
    (function() {
      var _originalOpen = window.open;
      window.open = function(url, target, features) {
        if (url && url.indexOf('metliner.com') !== -1) {
          try {
            window.top.location.href = url;
          } catch (e) {
            // Fallback if cross-origin restriction ever applies
            _originalOpen.call(window, url, target, features);
          }
          return null;
        }
        return _originalOpen.call(window, url, target, features);
      };
    })();
  </script>

  <script src="mapdata.js"></script>
  <script src="worldmap.js"></script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
